
name: Build ZXing-C++ JNI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # Windows Native
  # ============================================================

  native-windows:
    name: Native Windows x86_64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "===== Environment ====="
          Write-Host "JAVA_HOME:"
          Write-Host $env:JAVA_HOME
          java -version
          cmake --version

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S src/main/cpp `
            -B build/native `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install"

      - name: Build
        shell: pwsh
        run: |
          cmake `
            --build build/native `
            --config Release `
            --parallel

      - name: Install
        shell: pwsh
        run: |
          cmake `
            --install build/native `
            --config Release

      - name: List install directory
        shell: pwsh
        run: |
          Write-Host "===== build/install ====="
          Get-ChildItem `
            -Path build/install `
            -Recurse `
            -File

      - name: Prepare Windows native library
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "native/windows-x86_64" |
            Out-Null

          Copy-Item `
            "build/install/zxing_jni.dll" `
            "native/windows-x86_64/zxing_jni.dll"

      - name: Upload Windows native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-x86_64
          path: native/windows-x86_64
          if-no-files-found: error

  # ============================================================
  # Linux Native
  #
  # Build baseline:
  #   Ubuntu 20.04 / glibc 2.31
  #
  # Compiler:
  #   GCC 11 / C++20
  #
  # Runtime:
  #   Static libstdc++ and libgcc
  # ============================================================

  native-linux:
    name: Native Linux x86_64 (glibc 2.31)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Linux native library on Ubuntu 20.04
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash -euxo pipefail -c '

              echo "===== Ubuntu version ====="
              cat /etc/os-release

              export DEBIAN_FRONTEND=noninteractive

              echo "===== Install base dependencies ====="

              apt-get update

              apt-get install -y \
                ca-certificates \
                curl \
                gnupg \
                software-properties-common \
                git \
                build-essential \
                binutils \
                file \
                openjdk-11-jdk \
                python3 \
                python3-pip \
                ninja-build \
                unzip

              echo "===== Add Ubuntu Toolchain PPA ====="

              add-apt-repository -y ppa:ubuntu-toolchain-r/test

              apt-get update

              echo "===== Install GCC 11 ====="

              apt-get install -y \
                gcc-11 \
                g++-11

              echo "===== Compiler ====="

              gcc-11 --version
              g++-11 --version

              echo "===== Java ====="

              java -version

              export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
              export PATH="$JAVA_HOME/bin:$PATH"

              test -f "$JAVA_HOME/include/jni.h"

              echo "JAVA_HOME=$JAVA_HOME"

              echo "===== Install CMake ====="

              python3 -m pip install \
                --no-cache-dir \
                "cmake==3.31.6"

              cmake --version
              ninja --version

              echo "===== Compiler environment ====="

              export CC=gcc-11
              export CXX=g++-11

              echo "CC=$CC"
              echo "CXX=$CXX"

              echo "===== Clean build directory ====="

              rm -rf build/linux-container
              rm -rf build/install-linux

              mkdir -p build/linux-container

              echo "===== Configure CMake ====="

              cmake \
                -S src/main/cpp \
                -B build/linux-container \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/workspace/build/install-linux \
                -DCMAKE_C_COMPILER=gcc-11 \
                -DCMAKE_CXX_COMPILER=g++-11 \
                -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DCMAKE_CXX_EXTENSIONS=OFF \
                "-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -static-libgcc"

              echo "===== Build ====="

              cmake \
                --build build/linux-container \
                --parallel

              echo "===== Install ====="

              cmake \
                --install build/linux-container

              echo "===== Check output ====="

              find build/install-linux \
                -type f \
                -print

              LIBRARY=build/install-linux/libzxing_jni.so

              test -f "$LIBRARY"

              file "$LIBRARY"

              echo "===== Dynamic dependencies ====="

              ldd "$LIBRARY"

              echo "===== Check libstdc++ dependency ====="

              if readelf -d "$LIBRARY" | grep -q "libstdc++.so"; then
                echo "ERROR: libstdc++ is still dynamically linked"
                exit 1
              fi

              echo "Static libstdc++ check passed."

              echo "===== Check GLIBC ABI ====="

              GLIBC_VERSIONS="$(
                readelf --version-info "$LIBRARY" 2>/dev/null |
                grep -oE "GLIBC_[0-9]+(\.[0-9]+)+" |
                sort -Vu
              )"

              echo "$GLIBC_VERSIONS"

              MAX_GLIBC="$(
                echo "$GLIBC_VERSIONS" |
                sort -V |
                tail -n 1
              )"

              echo "MAX_GLIBC=$MAX_GLIBC"

              if [ -n "$MAX_GLIBC" ]; then
                if [ "$(printf "%s\n" "$MAX_GLIBC" GLIBC_2.31 | sort -V | tail -n 1)" != "GLIBC_2.31" ]; then
                  echo "ERROR: GLIBC requirement exceeds 2.31"
                  exit 1
                fi
              fi

              echo "GLIBC compatibility check passed."

              echo "===== Check GLIBCXX ABI ====="

              GLIBCXX_VERSIONS="$(
                readelf --version-info "$LIBRARY" 2>/dev/null |
                grep -oE "GLIBCXX_[0-9]+(\.[0-9]+)+" |
                sort -Vu || true
              )"

              if [ -n "$GLIBCXX_VERSIONS" ]; then
                echo "$GLIBCXX_VERSIONS"
                echo "ERROR: Dynamic GLIBCXX dependency detected"
                exit 1
              fi

              echo "No dynamic GLIBCXX dependency detected."

              echo "===== Prepare native artifact ====="

              mkdir -p native/linux-x86_64

              cp \
                "$LIBRARY" \
                native/linux-x86_64/libzxing_jni.so

              echo "===== Final native library ====="

              ls -lh native/linux-x86_64/libzxing_jni.so

            '

      - name: Upload Linux native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x86_64
          path: native/linux-x86_64
          if-no-files-found: error

  # ============================================================
  # Java Package
  # ============================================================

  package:
    name: Package Java JARs

    needs:
      - native-windows
      - native-linux

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Windows native library
        uses: actions/download-artifact@v4
        with:
          name: native-windows-x86_64
          path: src/main/resources/native/windows-x86_64

      - name: Download Linux native library
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: src/main/resources/native/linux-x86_64

      - name: List native resources
        shell: bash
        run: |
          echo "===== Native resources ====="
          find src/main/resources/native \
            -type f \
            -print

      - name: Build Maven JARs
        shell: bash
        run: |
          mvn \
            -B \
            -DskipTests \
            clean \
            package

      - name: List target
        shell: bash
        run: |
          echo "===== target ====="
          find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print \
            -exec ls -lh {} \;

      - name: Verify JAR files
        shell: bash
        run: |
          MAIN_JAR="$(find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" |
            head -n 1)"

          SOURCES_JAR="$(find target \
            -maxdepth 1 \
            -type f \
            -name "*-sources.jar" |
            head -n 1)"

          JAVADOC_JAR="$(find target \
            -maxdepth 1 \
            -type f \
            -name "*-javadoc.jar" |
            head -n 1)"

          echo "MAIN_JAR=$MAIN_JAR"
          echo "SOURCES_JAR=$SOURCES_JAR"
          echo "JAVADOC_JAR=$JAVADOC_JAR"

          test -n "$MAIN_JAR"
          test -n "$SOURCES_JAR"
          test -n "$JAVADOC_JAR"

          test -f "$MAIN_JAR"
          test -f "$SOURCES_JAR"
          test -f "$JAVADOC_JAR"

          echo "All three JAR files exist."

      - name: Verify native libraries in JAR
        shell: bash
        run: |
          MAIN_JAR="$(find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" |
            head -n 1)"

          echo "===== Main JAR ====="

          jar tf "$MAIN_JAR" |
            grep "^native/"

          echo "===== Verify Windows DLL ====="

          jar tf "$MAIN_JAR" |
            grep -q \
              "native/windows-x86_64/zxing_jni.dll"

          echo "===== Verify Linux SO ====="

          jar tf "$MAIN_JAR" |
            grep -q \
              "native/linux-x86_64/libzxing_jni.so"

          echo "Native libraries are inside main JAR."

      - name: Build release archive
        shell: bash
        run: |
          mkdir -p release

          cp target/*.jar release/

          cp \
            README.md \
            LICENSE \
            THIRD_PARTY_LICENSES.md \
            release/

          cd release

          zip \
            -r \
            "zxing-cpp-jni-${GITHUB_SHA::7}.zip" \
            .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zxing-cpp-jni-package
          path: |
            target/*.jar
            release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/*.jar
            release/*.zip
          generate_release_notes: true
