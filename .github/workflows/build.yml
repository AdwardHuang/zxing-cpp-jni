name: Build ZXing-C++ JNI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:

  native:

    name: Native ${{ matrix.platform }}

    strategy:
      fail-fast: false

      matrix:

        include:

          - os: windows-2022
            platform: windows-x86_64

          - os: ubuntu-22.04
            platform: linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5

      # --------------------------------------------------
      # JDK
      # --------------------------------------------------

      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      # --------------------------------------------------
      # Show environment
      # --------------------------------------------------

      - name: Show environment
        shell: bash
        run: |
          echo "OS: $RUNNER_OS"
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          cmake --version

      # --------------------------------------------------
      # Configure
      # --------------------------------------------------

      - name: Configure
        run: >
          cmake
          -S src/main/cpp
          -B build/native
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/install

      # --------------------------------------------------
      # Build
      # --------------------------------------------------

      - name: Build
        run: >
          cmake
          --build build/native
          --config Release
          --parallel

      # --------------------------------------------------
      # Install
      # --------------------------------------------------

      - name: Install
        run: >
          cmake
          --install build/native
          --config Release

      # --------------------------------------------------
      # Check output
      # --------------------------------------------------

      - name: List install directory
        shell: bash
        run: |
          echo "===== build/install ====="
          find build/install -type f -print

      # --------------------------------------------------
      # Prepare artifact
      # --------------------------------------------------

      - name: Prepare Windows native library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "native/${{ matrix.platform }}" |
            Out-Null

          Copy-Item `
            "build/install/zxing_jni.dll" `
            "native/${{ matrix.platform }}/zxing_jni.dll"

      - name: Prepare Linux native library
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "native/${{ matrix.platform }}"

          cp \
            "build/install/libzxing_jni.so" \
            "native/${{ matrix.platform }}/libzxing_jni.so"

      # --------------------------------------------------
      # Upload
      # --------------------------------------------------

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/${{ matrix.platform }}
          if-no-files-found: error


  # ======================================================
  # Java package
  # ======================================================

  package:

    name: Package Java JAR

    needs: native

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # --------------------------------------------------
      # Download Windows DLL
      # --------------------------------------------------

      - name: Download Windows native library
        uses: actions/download-artifact@v4
        with:
          name: native-windows-x86_64
          path: src/main/resources/native/windows-x86_64

      # --------------------------------------------------
      # Download Linux SO
      # --------------------------------------------------

      - name: Download Linux native library
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: src/main/resources/native/linux-x86_64

      # --------------------------------------------------
      # Build Maven
      # --------------------------------------------------

      - name: Build JAR
        run: |
          mvn -B -DskipTests package

      # --------------------------------------------------
      # Show result
      # --------------------------------------------------

      - name: List package
        run: |
          echo "===== target ====="
          find target -type f -print

      # --------------------------------------------------
      # Package release
      # --------------------------------------------------

      - name: Build release archive
        run: |
          mkdir -p release

          cp target/*.jar release/

          cp README.md \
             LICENSE \
             THIRD_PARTY_LICENSES.md \
             release/

          cd release

          zip \
            -r \
            "zxing-cpp-jni-${GITHUB_SHA::7}.zip" \
            .

      # --------------------------------------------------
      # Upload artifact
      # --------------------------------------------------

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: zxing-cpp-jni-package
          path: |
            target/*.jar
            release/*.zip

      # --------------------------------------------------
      # GitHub Release
      # --------------------------------------------------

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/*.jar
            release/*.zip
          generate_release_notes: true
