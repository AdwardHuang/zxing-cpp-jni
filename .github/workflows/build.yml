
name: Build ZXing-C++ JNI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # Windows Native
  # ============================================================

  native-windows:
    name: Native Windows x86_64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S src/main/cpp `
            -B build/native `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build/native --config Release --parallel

      - name: Install
        shell: pwsh
        run: |
          cmake --install build/native --config Release

      - name: Prepare Windows native library
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "native/windows-x86_64" |
            Out-Null

          Copy-Item `
            "build/install/zxing_jni.dll" `
            "native/windows-x86_64/zxing_jni.dll"

      - name: Upload Windows native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-x86_64
          path: native/windows-x86_64
          if-no-files-found: error


  # ============================================================
  # Linux Native
  #
  # Build environment:
  #   Ubuntu 20.04
  #   glibc 2.31
  #   GCC 10
  #
  # Target GLIBCXX:
  #   Maximum 3.4.28
  # ============================================================

  native-linux:
    name: Native Linux x86_64 (glibc 2.31 / GCC 10)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Linux native library on Ubuntu 20.04
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash -euxo pipefail -c '

              export DEBIAN_FRONTEND=noninteractive

              echo "===== Install dependencies ====="

              apt-get update

              apt-get install -y \
                ca-certificates \
                git \
                build-essential \
                gcc-10 \
                g++-10 \
                binutils \
                file \
                openjdk-11-jdk \
                python3 \
                python3-pip \
                ninja-build

              echo "===== Configure environment ====="

              export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
              export PATH="$JAVA_HOME/bin:$PATH"

              export CC=gcc-10
              export CXX=g++-10

              test -f "$JAVA_HOME/include/jni.h"

              echo "===== GCC version ====="

              gcc-10 --version
              g++-10 --version

              echo "===== Java version ====="

              java -version

              echo "===== System libstdc++ versions ====="

              strings /usr/lib/x86_64-linux-gnu/libstdc++.so.6 \
                | grep GLIBCXX_ \
                | sort -Vu \
                | tail

              echo "===== Install CMake ====="

              python3 -m pip install \
                --no-cache-dir \
                "cmake==3.31.6"

              cmake --version

              echo "===== Clean build directory ====="

              rm -rf build/linux-container
              rm -rf build/install-linux

              mkdir -p build/linux-container

              echo "===== Configure CMake ====="

              cmake \
                -S src/main/cpp \
                -B build/linux-container \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/workspace/build/install-linux \
                -DCMAKE_C_COMPILER=gcc-10 \
                -DCMAKE_CXX_COMPILER=g++-10 \
                -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DCMAKE_CXX_EXTENSIONS=OFF

              echo "===== Build ====="

              cmake \
                --build build/linux-container \
                --parallel

              echo "===== Install ====="

              cmake \
                --install build/linux-container

              SO=build/install-linux/libzxing_jni.so

              test -f "$SO"

              echo "===== File information ====="

              file "$SO"

              echo "===== Dynamic dependencies ====="

              ldd "$SO" || true

              echo "===== ELF version information ====="

              readelf --version-info "$SO" || true

              echo "===== Detect GLIBC versions ====="

              GLIBC_VERSIONS="$(
                readelf --version-info "$SO" 2>/dev/null |
                grep -oE "GLIBC_[0-9]+(\\.[0-9]+)+" |
                sort -Vu |
                tr "\n" " "
              )"

              echo "GLIBC_VERSIONS=$GLIBC_VERSIONS"

              echo "===== Detect GLIBCXX versions ====="

              GLIBCXX_VERSIONS="$(
                readelf --version-info "$SO" 2>/dev/null |
                grep -oE "GLIBCXX_[0-9]+(\\.[0-9]+)+" |
                sort -Vu |
                tr "\n" " "
              )"

              echo "GLIBCXX_VERSIONS=$GLIBCXX_VERSIONS"

              echo "===== Detect CXXABI versions ====="

              CXXABI_VERSIONS="$(
                readelf --version-info "$SO" 2>/dev/null |
                grep -oE "CXXABI_[0-9]+(\\.[0-9]+)+" |
                sort -Vu |
                tr "\n" " "
              )"

              echo "CXXABI_VERSIONS=$CXXABI_VERSIONS"

              echo "===== Verify GLIBC <= 2.31 ====="

              if echo "$GLIBC_VERSIONS" |
                grep -qE "GLIBC_(2\\.(3[2-9]|[4-9][0-9]))|GLIBC_([3-9])"; then

                echo "ERROR: GLIBC version exceeds 2.31"
                echo "$GLIBC_VERSIONS"
                exit 1
              fi

              echo "GLIBC compatibility check passed."

              echo "===== Verify GLIBCXX <= 3.4.28 ====="

              if echo "$GLIBCXX_VERSIONS" |
                grep -qE "GLIBCXX_3\\.4\\.([3-9][0-9])|GLIBCXX_3\\.([5-9])"; then

                echo "ERROR: GLIBCXX version exceeds 3.4.28"
                echo "$GLIBCXX_VERSIONS"
                exit 1
              fi

              echo "GLIBCXX compatibility check passed."

              echo "===== Prepare native artifact ====="

              mkdir -p native/linux-x86_64

              cp \
                "$SO" \
                native/linux-x86_64/libzxing_jni.so

              ls -lh native/linux-x86_64/libzxing_jni.so

            '

      - name: Upload Linux native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x86_64
          path: native/linux-x86_64
          if-no-files-found: error


  # ============================================================
  # Maven Package
  # ============================================================

  package:
    name: Package Java JARs

    needs:
      - native-windows
      - native-linux

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Download Windows native library
        uses: actions/download-artifact@v4
        with:
          name: native-windows-x86_64
          path: src/main/resources/native/windows-x86_64

      - name: Download Linux native library
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: src/main/resources/native/linux-x86_64

      - name: List native resources
        shell: bash
        run: |
          find src/main/resources/native -type f -print

      - name: Build Maven JARs
        shell: bash
        run: |
          mvn -B -DskipTests clean package

      - name: Verify JAR outputs
        shell: bash
        run: |
          MAIN_JAR="$(find target \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' |
            head -n 1)"

          SOURCES_JAR="$(find target \
            -maxdepth 1 \
            -type f \
            -name '*-sources.jar' |
            head -n 1)"

          JAVADOC_JAR="$(find target \
            -maxdepth 1 \
            -type f \
            -name '*-javadoc.jar' |
            head -n 1)"

          test -n "$MAIN_JAR"
          test -n "$SOURCES_JAR"
          test -n "$JAVADOC_JAR"

          echo "Main JAR: $MAIN_JAR"
          echo "Sources JAR: $SOURCES_JAR"
          echo "Javadoc JAR: $JAVADOC_JAR"

          jar tf "$MAIN_JAR" |
            grep -Fx "native/windows-x86_64/zxing_jni.dll"

          jar tf "$MAIN_JAR" |
            grep -Fx "native/linux-x86_64/libzxing_jni.so"

      - name: Upload Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-jars
          path: target/*.jar
          if-no-files-found: error

      - name: Create release package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p release

          cp target/*.jar release/

          cp native/windows-x86_64/zxing_jni.dll \
            release/zxing_jni-windows-x86_64.dll

          cp native/linux-x86_64/libzxing_jni.so \
            release/libzxing_jni-linux-x86_64.so

          cd release

          zip -9 \
            "../zxing-cpp-jni-${GITHUB_REF_NAME}.zip" \
            ./*

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: zxing-cpp-jni-release
          path: zxing-cpp-jni-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zxing-cpp-jni-${{ github.ref_name }}.zip
            target/*.jar
          generate_release_notes: true
